version: 2

project_name: prox

before:
  hooks:
    - go mod tidy

builds:
  - id: prox
    binary: prox
    main: ./cmd/prox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/prox/internal/version.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

nfpms:
  - id: prox-deb
    package_name: prox
    file_name_template: "prox_{{ .Version }}_{{ .Arch }}"
    vendor: charliek
    homepage: "https://github.com/charliek/prox"
    maintainer: "Charlie Knudsen <charlie.knudsen@gmail.com>"
    description: "Modern process manager for development with API-first design"
    license: MIT
    formats:
      - deb
    bindir: /usr/local/bin
    ids:
      - prox

brews:
  - name: prox
    ids:
      - default
    repository:
      owner: charliek
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/charliek/prox"
    description: "Modern process manager for development with API-first design"
    license: "MIT"
    install: |
      bin.install "prox"
    test: |
      system bin/"prox", "version"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: charliek
    name: prox
  draft: false
  prerelease: auto
  mode: replace

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
