name: CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main, 'feature/*']

jobs:
  test:
    # Matrix over Linux + macOS so the darwin-tagged process code
    # (internal/daemon/process_darwin.go) and the process-start-token liveness
    # path are exercised in CI on every change, not just cross-built by the
    # release pipeline. macos-latest (Apple Silicon) runs the full suite,
    # including test/integration; fail-fast:false keeps the ubuntu leg's results
    # visible if the macOS leg flakes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Hard backstop. Without this a job inherits GitHub's 6-HOUR default, so a
    # deadlocked test -- or a hung child process holding the job's stdout pipe
    # open, which Go's own -timeout cannot interrupt -- burns runner minutes and
    # blocks the queue until someone notices. The suite takes ~140s locally;
    # hosted runners are slower and have fewer cores, so this is generous
    # against observed cost while still bounded.
    timeout-minutes: 25
    steps:
      # persist-credentials: false — actions/checkout otherwise leaves the job
      # token in .git/config, and the very next step runs `go test ./...`, i.e.
      # this repo's code AND every dependency's test code, with a writable
      # credential sitting on disk. Nothing here talks to the API, so there is
      # nothing to keep it for. (docs.yml and docs-pr.yml already set this.)
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      # -timeout must match the Makefile's, or a local pass and a CI pass do not
      # mean the same thing: with no flag, `go test` uses its 10m default, so a
      # run that passes under `make test` (20m) could die on a CI panic-dump.
      - run: go test -timeout 20m -v ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # See the test job: the linter loads and analyses the same third-party
      # code, so the token has no business being on disk here either.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  # Validate the GoReleaser pipeline (including the nfpms: deb block) without
  # publishing anything. Catches broken nfpm config before it hits a real tag.
  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # GoReleaser needs the full history to compute a snapshot version;
          # it does not need (and this job never uses) the job token, so the
          # credential is dropped while the depth is kept.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,announce,sign
      - name: Validate the deb artifacts
        run: |
          set -e
          for arch in amd64 arm64; do
            deb=$(ls dist/prox_*_${arch}.deb 2>/dev/null | head -1)
            [ -n "$deb" ] || { echo "no $arch deb produced"; ls -la dist/; exit 1; }
            echo "=== validating $deb ==="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            dpkg-deb --field "$deb" Package | grep -qx 'prox'
            dpkg-deb --field "$deb" Architecture | grep -qx "$arch"
            dpkg-deb --contents "$deb" | grep -q ' \./usr/local/bin/prox$'
          done
