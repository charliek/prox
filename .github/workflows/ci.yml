name: CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main, 'feature/*']

jobs:
  test:
    # Matrix over Linux + macOS so the darwin-tagged process code
    # (internal/daemon/process_darwin.go) and the process-start-token liveness
    # path are exercised in CI on every change, not just cross-built by the
    # release pipeline. macos-latest (Apple Silicon) runs the full suite,
    # including test/integration; fail-fast:false keeps the ubuntu leg's results
    # visible if the macOS leg flakes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  # Validate the GoReleaser pipeline (including the nfpms: deb block) without
  # publishing anything. Catches broken nfpm config before it hits a real tag.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,announce,sign
      - name: Validate the deb artifacts
        run: |
          set -e
          for arch in amd64 arm64; do
            deb=$(ls dist/prox_*_${arch}.deb 2>/dev/null | head -1)
            [ -n "$deb" ] || { echo "no $arch deb produced"; ls -la dist/; exit 1; }
            echo "=== validating $deb ==="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            dpkg-deb --field "$deb" Package | grep -qx 'prox'
            dpkg-deb --field "$deb" Architecture | grep -qx "$arch"
            dpkg-deb --contents "$deb" | grep -q ' \./usr/local/bin/prox$'
          done
